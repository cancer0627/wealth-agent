[project]
name = "wealth-agent-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["wealth-agent-api"]

[tool.uv]
package = false

[tool.uv.sources]
wealth-agent-api = { workspace = true }

[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = [
    "apps/api/tests",
    "apps/api/src/wealth_agent/capabilities",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wealth_agent"]
mypy_path = ["apps/api/src"]
