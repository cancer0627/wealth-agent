[project]
name = "wealth-agent-api"
version = "0.1.0"
description = "Local wealth Agent API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "numpy>=2.0,<3.0",
    "onnxruntime>=1.22,<1.23",
    "pillow>=11.0,<13.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "rapidocr>=3.9,<4.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
wealth-agent-api = "wealth_agent.bootstrap.http_main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wealth_agent"]
exclude = ["src/wealth_agent/capabilities/*/tests/**"]
